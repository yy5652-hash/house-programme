name: keep-warm
# The demo runs on a free instance that sleeps after 15 quiet minutes and takes about a minute to wake.
# Scheduled runs are best effort and arrive late: asked for every ten minutes they came 16 to 25 minutes apart, which
# still let the instance sleep. Asking every five keeps the real gaps under the fifteen-minute limit more often.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl --silent --show-error --fail --max-time 120 https://house-programme.onrender.com/api/health
